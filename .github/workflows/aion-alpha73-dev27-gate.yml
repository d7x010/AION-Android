name: AION dev28 Gate
on:
  push:
    branches:
      - main
    paths:
      - AION-ALPHA73-DEV28-CONTINUITY-SOURCE.zip
      - .github/workflows/aion-alpha73-dev27-gate.yml
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Extract source
        run: unzip -q AION-ALPHA73-DEV28-CONTINUITY-SOURCE.zip -d .aion
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"
      - name: Test and build
        working-directory: .aion
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon
      - name: Package APK
        run: cp .aion/app/build/outputs/apk/debug/app-debug.apk AION-dev28.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AION-dev28-APK
          path: AION-dev28.apk
