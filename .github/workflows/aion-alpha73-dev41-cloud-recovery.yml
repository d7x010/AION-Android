name: AION dev41 Cloud Recovery

on:
  push:
    branches: [main]
    paths:
      - "AION-ALPHA73-DEV41-CLOUD-RECOVERY-SOURCE.zip"
      - ".github/workflows/aion-alpha73-dev41-cloud-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Extract source
        run: unzip -q AION-ALPHA73-DEV41-CLOUD-RECOVERY-SOURCE.zip -d .aion
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Test AION Cloud
        working-directory: .aion
        run: node --check cloudflare/aion-core/src/index.js && node --test cloudflare/aion-core/test-worker.mjs

  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - name: Extract source
        run: unzip -q AION-ALPHA73-DEV41-CLOUD-RECOVERY-SOURCE.zip -d .aion
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"
      - name: Test lint and build APK
        working-directory: .aion
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon
      - name: Prepare APK
        run: cp .aion/app/build/outputs/apk/debug/app-debug.apk AION-dev41.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AION-dev41-APK
          path: AION-dev41.apk
          retention-days: 30

  deploy-cloud:
    needs: [worker-tests, build-android]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Extract source
        run: unzip -q AION-ALPHA73-DEV41-CLOUD-RECOVERY-SOURCE.zip -d .aion
      - name: Deploy aion-core
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: .aion/cloudflare/aion-core
