name: AION α7.3 Step 7 Gate

on:
  push:
    branches: [main]
    paths:
      - "AION-ALPHA73-STEP7-SOURCE.zip"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  step7-points7-8:
    name: Step 7.7 + 7.8 Search + Calculator + Tool Loop + APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: جلب المستودع
        uses: actions/checkout@v5

      - name: استخراج AION α7.3 dev22
        shell: bash
        run: |
          set -euo pipefail
          test -f AION-ALPHA73-STEP7-SOURCE.zip
          rm -rf .aion-alpha73-step7
          mkdir .aion-alpha73-step7
          unzip -q AION-ALPHA73-STEP7-SOURCE.zip -d .aion-alpha73-step7
          test -f .aion-alpha73-step7/settings.gradle.kts
          test -f .aion-alpha73-step7/app/build.gradle.kts
          test -f .aion-alpha73-step7/cloudflare/aion-core/src/index.js
          test -f .aion-alpha73-step7/cloudflare/aion-core/test-worker.mjs
          test -f .aion-alpha73-step7/app/src/main/java/com/aion/mobile/core/tools/ToolRegistry.kt
          test -f .aion-alpha73-step7/app/src/main/java/com/aion/mobile/core/tools/DeterministicCalculator.kt
          test -f .aion-alpha73-step7/app/src/main/java/com/aion/mobile/core/tools/ToolLoopPolicy.kt
          test -f .aion-alpha73-step7/app/src/test/java/com/aion/mobile/core/tools/DeterministicCalculatorTest.kt
          test -f .aion-alpha73-step7/app/src/test/java/com/aion/mobile/core/tools/ToolLoopPolicyTest.kt
          test -f .aion-alpha73-step7/AION_ALPHA73_STEP7_SEARCH_TOOL_LOOP_AR.md
          test -f .aion-alpha73-step7/STEP7_POINTS7_8_LOCAL_STATUS_AR.md
          grep -q 'versionCode = 36' .aion-alpha73-step7/app/build.gradle.kts
          grep -q 'versionName = "2.0.0-alpha7.3-dev22"' .aion-alpha73-step7/app/build.gradle.kts
          grep -q '7.3.0-dev22' .aion-alpha73-step7/cloudflare/aion-core/src/index.js
          grep -q 'SEARCH_INTELLIGENCE_CONTRACT = 1' .aion-alpha73-step7/cloudflare/aion-core/src/index.js
          grep -q 'TOOL_LOOP_CONTRACT = 1' .aion-alpha73-step7/cloudflare/aion-core/src/index.js
          grep -q 'MAX_TOOL_STEPS = 4' .aion-alpha73-step7/cloudflare/aion-core/src/index.js
          grep -q 'deterministic-calculator-v1' .aion-alpha73-step7/app/src/main/java/com/aion/mobile/core/tools/DeterministicCalculator.kt
          grep -q 'bounded-multi-step-tool-loop-v1' .aion-alpha73-step7/app/src/main/java/com/aion/mobile/core/tools/ToolLoopPolicy.kt
          grep -q 'registry: \["calculator", "web.search"\]' .aion-alpha73-step7/cloudflare/aion-core/src/index.js
          grep -q 'route = "multi-step"\|"multi-step"' .aion-alpha73-step7/app/src/main/java/com/aion/mobile/core/orchestration/AionOrchestratorContract.kt
          grep -q 'fun setConversationTemporaryMemory(temporary: Boolean)' .aion-alpha73-step7/app/src/main/java/com/aion/mobile/feature/chat/ChatViewModel.kt
          ! grep -q 'fun setTemporaryConversation(temporary: Boolean)' .aion-alpha73-step7/app/src/main/java/com/aion/mobile/feature/chat/ChatViewModel.kt
          ! test -f .aion-alpha73-step7/app/src/main/java/com/aion/mobile/core/tools/SafeCodeSandboxPolicy.kt
          ! test -f .aion-alpha73-step7/app/src/main/java/com/aion/mobile/core/response/AionResponsePolicy.kt
          ! test -f .aion-alpha73-step7/app/src/main/java/com/aion/mobile/core/files/FileToolPolicy.kt
          ! grep -R -q 'legacy-web-search' .aion-alpha73-step7/app/src .aion-alpha73-step7/cloudflare/aion-core

      - name: إعداد Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: إعداد Android SDK
        uses: android-actions/setup-android@v3

      - name: تثبيت Android 16 وأدوات البناء
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: إعداد Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"

      - name: Worker regression + Step 7.7/7.8 search-calculator-loop tests
        working-directory: .aion-alpha73-step7
        run: |
          node --check cloudflare/aion-core/src/index.js
          node --check cloudflare/aion-core/test-worker.mjs
          node cloudflare/aion-core/test-worker.mjs

      - name: Android Unit + Lint + assembleDebug
        working-directory: .aion-alpha73-step7
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace --no-daemon

      - name: التحقق من APK
        shell: bash
        run: |
          set -euo pipefail
          APK=.aion-alpha73-step7/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          cp "$APK" AION-alpha73-step7-dev22.apk
          sha256sum AION-alpha73-step7-dev22.apk | tee AION-alpha73-step7-dev22.sha256

      - name: رفع APK
        uses: actions/upload-artifact@v4
        with:
          name: AION-alpha73-step7-dev22-APK
          path: |
            AION-alpha73-step7-dev22.apk
            AION-alpha73-step7-dev22.sha256
          if-no-files-found: error
          retention-days: 30
