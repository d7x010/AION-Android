name: AION Step 15 Final Android Gate

on:
  push:
    branches: [main]
    paths:
      - "AION-ALPHA82-STEP15-POINT15.6-BLOCKED-SOURCE.zip"
      - ".github/workflows/aion-step15-final-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_ZIP: AION-ALPHA82-STEP15-POINT15.6-BLOCKED-SOURCE.zip
  SOURCE_SHA256: 6a550ce1644fca16b3f5ac296532c0eb5b7b2dfff8f660328518cc982243ffb9
  GRADLE_VERSION: "9.6.0"
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"
  WRANGLER_VERSION: "4.129.1"

jobs:
  android-gate:
    name: Gradle + Lint + APK/AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Verify source snapshot SHA-256
        shell: bash
        run: |
          set -euo pipefail
          echo "${SOURCE_SHA256}  ${SOURCE_ZIP}" | sha256sum -c -

      - name: Extract AION source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .aion_unpack
          mkdir -p .aion_unpack
          unzip -q "${SOURCE_ZIP}" -d .aion_unpack
          AION_DIR="$(find .aion_unpack -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -n "${AION_DIR}"
          test -f "${AION_DIR}/settings.gradle.kts"
          test -f "${AION_DIR}/app/build.gradle.kts"
          echo "AION_DIR=${AION_DIR}" >> "${GITHUB_ENV}"
          echo "AION source root: ${AION_DIR}"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

      - name: Setup Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Step 15.2 + 15.3 — Unit tests and Android Lint
        shell: bash
        run: |
          set -euo pipefail
          cd "${AION_DIR}"
          mkdir -p release
          python3 tools/release/aion_step15_gradle_lint_gate.py \
            --root . \
            --gradle-cmd "$(command -v gradle)" \
            --sdk-root "${ANDROID_SDK_ROOT}" \
            --evidence-out release/STEP15_GRADLE_LINT_EVIDENCE.json \
            --timeout-seconds 2400 \
            2>&1 | tee release/STEP15_GRADLE_LINT_GATE.log

      - name: Build debug APK and release AAB
        shell: bash
        run: |
          set -euo pipefail
          cd "${AION_DIR}"
          gradle \
            :app:assembleDebug \
            :app:bundleRelease \
            --no-daemon \
            --stacktrace \
            2>&1 | tee release/STEP15_BUILD.log

      - name: Prepare Android artifacts
        shell: bash
        run: |
          set -euo pipefail
          cd "${AION_DIR}"

          APK="app/build/outputs/apk/debug/app-debug.apk"
          AAB="app/build/outputs/bundle/release/app-release.aab"

          test -s "${APK}"
          test -s "${AAB}"

          mkdir -p release/artifacts
          cp "${APK}" release/artifacts/AION-alpha82-dev2-debug.apk
          cp "${AAB}" release/artifacts/AION-alpha82-dev2-release-unsigned.aab

          sha256sum release/artifacts/AION-alpha82-dev2-debug.apk \
            | tee release/artifacts/AION-alpha82-dev2-debug.apk.sha256
          sha256sum release/artifacts/AION-alpha82-dev2-release-unsigned.aab \
            | tee release/artifacts/AION-alpha82-dev2-release-unsigned.aab.sha256

      - name: Step 15.4 — Verify installable APK and signature
        shell: bash
        run: |
          set -euo pipefail
          cd "${AION_DIR}"
          export PATH="${ANDROID_SDK_ROOT}/build-tools/${BUILD_TOOLS}:${PATH}"

          python3 tools/release/aion_step15_artifact_gate.py \
            --root . \
            --artifact release/artifacts/AION-alpha82-dev2-debug.apk \
            --gradle-evidence release/STEP15_GRADLE_LINT_EVIDENCE.json \
            --evidence-out release/STEP15_APK_ARTIFACT_EVIDENCE.json \
            2>&1 | tee release/STEP15_APK_ARTIFACT_GATE.log

      - name: Upload Android build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AION-Step15-Android-Evidence
          path: |
            ${{ env.AION_DIR }}/release/STEP15_GRADLE_LINT_EVIDENCE.json
            ${{ env.AION_DIR }}/release/STEP15_GRADLE_LINT_GATE.log
            ${{ env.AION_DIR }}/release/STEP15_BUILD.log
            ${{ env.AION_DIR }}/release/STEP15_APK_ARTIFACT_EVIDENCE.json
            ${{ env.AION_DIR }}/release/STEP15_APK_ARTIFACT_GATE.log
            ${{ env.AION_DIR }}/app/build/reports/lint-results-debug*
          if-no-files-found: warn
          retention-days: 30

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AION-alpha82-dev2-APK
          path: |
            ${{ env.AION_DIR }}/release/artifacts/AION-alpha82-dev2-debug.apk
            ${{ env.AION_DIR }}/release/artifacts/AION-alpha82-dev2-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload unsigned AAB
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AION-alpha82-dev2-AAB-UNSIGNED
          path: |
            ${{ env.AION_DIR }}/release/artifacts/AION-alpha82-dev2-release-unsigned.aab
            ${{ env.AION_DIR }}/release/artifacts/AION-alpha82-dev2-release-unsigned.aab.sha256
          if-no-files-found: error
          retention-days: 30

  worker-gate:
    name: Worker tests + Wrangler dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Verify source snapshot SHA-256
        shell: bash
        run: |
          set -euo pipefail
          echo "${SOURCE_SHA256}  ${SOURCE_ZIP}" | sha256sum -c -

      - name: Extract AION source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .aion_unpack
          mkdir -p .aion_unpack
          unzip -q "${SOURCE_ZIP}" -d .aion_unpack
          AION_DIR="$(find .aion_unpack -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -n "${AION_DIR}"
          echo "AION_DIR=${AION_DIR}" >> "${GITHUB_ENV}"

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install pinned Wrangler
        shell: bash
        run: npm install --global "wrangler@${WRANGLER_VERSION}"

      - name: Step 15.5 — Worker tests and deploy dry-run
        shell: bash
        run: |
          set -euo pipefail
          cd "${AION_DIR}"
          mkdir -p release

          python3 tools/release/aion_step15_worker_deploy_gate.py \
            --root . \
            --require-dry-run \
            --wrangler-cmd "$(command -v wrangler)" \
            --evidence-out release/STEP15_WORKER_EVIDENCE.json \
            2>&1 | tee release/STEP15_WORKER_GATE.log

          node --test cloudflare/aion-sandbox/test-policy.mjs \
            2>&1 | tee release/STEP15_SANDBOX_POLICY.log

      - name: Upload Worker evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AION-Step15-Worker-Evidence
          path: |
            ${{ env.AION_DIR }}/release/STEP15_WORKER_EVIDENCE.json
            ${{ env.AION_DIR }}/release/STEP15_WORKER_GATE.log
            ${{ env.AION_DIR }}/release/STEP15_SANDBOX_POLICY.log
          if-no-files-found: warn
          retention-days: 30
