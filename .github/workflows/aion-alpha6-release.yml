name: AION α6 Free Cloud Release

on:
  push:
    branches: [main]
    paths:
      - "AION-alpha6-Free-Cloud.zip"
      - ".github/workflows/aion-alpha6-release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - name: استخراج α6
        run: unzip -q AION-alpha6-Free-Cloud.zip -d .aion-alpha6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: إعداد أدوات Android
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          sed -i -E 's/compileSdk[[:space:]]*=[[:space:]]*[0-9.]+/compileSdk = 36/' .aion-alpha6/android/app/build.gradle.kts
          sed -i 's/androidx.compose:compose-bom:2026.08.00/androidx.compose:compose-bom:2025.08.00/' .aion-alpha6/android/app/build.gradle.kts
          sed -i 's/androidx.activity:activity-compose:1.13.0/androidx.activity:activity-compose:1.11.0/' .aion-alpha6/android/app/build.gradle.kts
          sed -i 's/androidx.lifecycle:lifecycle-runtime-ktx:2.10.0/androidx.lifecycle:lifecycle-runtime-ktx:2.9.4/' .aion-alpha6/android/app/build.gradle.kts
          sed -i 's/androidx.lifecycle:lifecycle-viewmodel-compose:2.10.0/androidx.lifecycle:lifecycle-viewmodel-compose:2.9.4/' .aion-alpha6/android/app/build.gradle.kts
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"
      - name: اختبار وبناء APK
        working-directory: .aion-alpha6/android
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace --no-daemon
      - name: رفع APK
        uses: actions/upload-artifact@v4
        with:
          name: AION-alpha6-Free-Cloud-APK
          path: .aion-alpha6/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  deploy-cloud:
    needs: build-android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: unzip -q AION-alpha6-Free-Cloud.zip -d .aion-alpha6
      - name: نشر aion-core
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: .aion-alpha6/cloudflare/aion-core
