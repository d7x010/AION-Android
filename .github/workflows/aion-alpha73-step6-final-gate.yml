name: AION α7.3 Step 6 Final Closure Gate

on:
  push:
    branches: [main]
    paths:
      - "AION-ALPHA73-STEP6-FINAL-SOURCE.zip"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final-closure:
    name: Step 6 Final Integration + APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: جلب المستودع
        uses: actions/checkout@v5

      - name: استخراج AION α7.3 dev16
        shell: bash
        run: |
          set -euo pipefail
          test -f AION-ALPHA73-STEP6-FINAL-SOURCE.zip
          rm -rf .aion-alpha73-step6-final
          mkdir .aion-alpha73-step6-final
          unzip -q AION-ALPHA73-STEP6-FINAL-SOURCE.zip -d .aion-alpha73-step6-final
          test -f .aion-alpha73-step6-final/settings.gradle.kts
          test -f .aion-alpha73-step6-final/app/build.gradle.kts
          test -f .aion-alpha73-step6-final/cloudflare/aion-core/src/index.js
          test -f .aion-alpha73-step6-final/cloudflare/aion-core/test-worker.mjs
          test -f .aion-alpha73-step6-final/app/src/test/java/com/aion/mobile/core/ai/Step6IntegrationContractTest.kt
          test -f .aion-alpha73-step6-final/STEP6_FINAL_CLOSURE_STATUS_AR.md
          grep -q 'versionCode = 30' .aion-alpha73-step6-final/app/build.gradle.kts
          grep -q 'versionName = "2.0.0-alpha7.3-dev16"' .aion-alpha73-step6-final/app/build.gradle.kts
          grep -q '7.3.0-dev16' .aion-alpha73-step6-final/cloudflare/aion-core/src/index.js
          grep -q 'testStep6IntegratedClosureMatrix' .aion-alpha73-step6-final/cloudflare/aion-core/test-worker.mjs
          grep -q 'await testStep6IntegratedClosureMatrix();' .aion-alpha73-step6-final/cloudflare/aion-core/test-worker.mjs
          grep -q 'testStep6IntegratedClosureContract' .aion-alpha73-step6-final/cloudflare/aion-core/test-worker.mjs
          grep -q 'await testStep6IntegratedClosureContract();' .aion-alpha73-step6-final/cloudflare/aion-core/test-worker.mjs

      - name: إعداد Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: إعداد Android SDK
        uses: android-actions/setup-android@v3

      - name: تثبيت Android 16 وأدوات البناء
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: إعداد Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"

      - name: Worker regression + Step 6 final closure matrix
        working-directory: .aion-alpha73-step6-final
        run: |
          node --check cloudflare/aion-core/src/index.js
          node --check cloudflare/aion-core/test-worker.mjs
          node cloudflare/aion-core/test-worker.mjs

      - name: Android Unit + Lint + assembleDebug
        working-directory: .aion-alpha73-step6-final
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace --no-daemon

      - name: التحقق من APK
        shell: bash
        run: |
          set -euo pipefail
          APK=.aion-alpha73-step6-final/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          cp "$APK" AION-alpha73-step6-final-dev16.apk
          sha256sum AION-alpha73-step6-final-dev16.apk | tee AION-alpha73-step6-final-dev16.sha256

      - name: رفع APK النهائي للمرحلة
        uses: actions/upload-artifact@v4
        with:
          name: AION-alpha73-step6-final-dev16-APK
          path: |
            AION-alpha73-step6-final-dev16.apk
            AION-alpha73-step6-final-dev16.sha256
          if-no-files-found: error
          retention-days: 30
