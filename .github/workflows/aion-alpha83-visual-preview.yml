name: AION alpha8.3 visual preview

on:
  workflow_dispatch:
  push:
    branches:
      - "aion/alpha83-visual-preview-dev1"
    paths:
      - "AION-ALPHA83-VISUAL-PREVIEW-DEV1-SOURCE.zip"
      - ".github/workflows/aion-alpha83-visual-preview.yml"

permissions:
  contents: read

env:
  SOURCE_ZIP: AION-ALPHA83-VISUAL-PREVIEW-DEV1-SOURCE.zip
  SOURCE_SHA256: f8a9d91d51eb4bf4de8d75624681571100b3ef16a67198bbb33cc904d1cda103

jobs:
  build-verify:
    name: test-lint-apk-aab
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify and extract immutable source snapshot
        shell: bash
        run: |
          set -euo pipefail
          echo "${SOURCE_SHA256}  ${SOURCE_ZIP}" | sha256sum -c -
          mkdir -p .aion_unpack
          unzip -q "${SOURCE_ZIP}" -d .aion_unpack
          test -f .aion_unpack/settings.gradle.kts
          test -f .aion_unpack/app/build.gradle.kts
          echo "AION_DIR=${GITHUB_WORKSPACE}/.aion_unpack" >> "${GITHUB_ENV}"

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Install Android SDK 36 and Build Tools 36.0.0
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses and install packages
        shell: bash
        run: |
          # sdkmanager exits after consuming enough input; with pipefail, `yes`
          # then reports SIGPIPE despite the licenses having been accepted.
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Verify source version gate
        shell: bash
        run: |
          grep -F 'versionCode = 58' "${AION_DIR}/app/build.gradle.kts"
          grep -F 'versionName = "2.0.0-alpha8.3-dev1"' "${AION_DIR}/app/build.gradle.kts"

      - name: Unit tests, lint, debug APK and release AAB
        shell: bash
        run: |
          cd "${AION_DIR}"
          gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:bundleRelease --stacktrace --no-daemon

      - name: Rename and verify artifacts
        shell: bash
        run: |
          export PATH="${ANDROID_SDK_ROOT}/build-tools/36.0.0:${PATH}"
          mkdir -p release-artifacts
          cp "${AION_DIR}/app/build/outputs/apk/debug/app-debug.apk" release-artifacts/AION-alpha83-visual-preview-dev1.apk
          cp "${AION_DIR}/app/build/outputs/bundle/release/app-release.aab" release-artifacts/AION-alpha83-visual-preview-dev1.aab
          apksigner verify --verbose --print-certs release-artifacts/AION-alpha83-visual-preview-dev1.apk
          (
            cd release-artifacts
            sha256sum AION-alpha83-visual-preview-dev1.apk AION-alpha83-visual-preview-dev1.aab > SHA256SUMS.txt
          )

      - name: Upload verified APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: AION-alpha83-visual-preview-dev1
          path: release-artifacts/
          if-no-files-found: error
