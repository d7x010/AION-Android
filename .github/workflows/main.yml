name: بناء AION Mobile V2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: بناء وفحص AION APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: جلب المستودع
        uses: actions/checkout@v4
        with:
          ref: main

      - name: تحديد مكان مشروع AION
        id: project
        shell: bash
        run: |
          if [ -f settings.gradle.kts ] && [ -f app/build.gradle.kts ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
            echo "bootstrap=false" >> "$GITHUB_OUTPUT"
            echo "تم العثور على المشروع داخل المستودع."
          elif [ -f AION-Mobile-V2-fixed.zip ]; then
            rm -rf .aion-bootstrap
            mkdir .aion-bootstrap
            unzip -q AION-Mobile-V2-fixed.zip -d .aion-bootstrap
            test -f .aion-bootstrap/settings.gradle.kts
            test -f .aion-bootstrap/app/build.gradle.kts
            echo "dir=.aion-bootstrap" >> "$GITHUB_OUTPUT"
            echo "bootstrap=true" >> "$GITHUB_OUTPUT"
            echo "تم فك مشروع AION من الملف المضغوط."
          else
            echo "لم أجد مشروع Android ولا ملف AION-Mobile-V2.zip"
            exit 1
          fi

      - name: إعداد Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: إعداد Android SDK الرسمي
        uses: android-actions/setup-android@v3

      - name: تثبيت أدوات Android
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: إعداد Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"

      - name: عرض معلومات بيئة البناء
        shell: bash
        run: |
          java -version
          gradle --version
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: اختبار وبناء تطبيق AION
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace --no-daemon

      - name: التحقق من ملف APK
        shell: bash
        run: |
          PROJECT_DIR="${{ steps.project.outputs.dir }}"
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          cp "$APK" AION-Mobile-V2.apk
          sha256sum AION-Mobile-V2.apk | tee AION-Mobile-V2.sha256

      - name: رفع ملف APK
        uses: actions/upload-artifact@v4
        with:
          name: AION-Mobile-V2-APK
          path: |
            AION-Mobile-V2.apk
            AION-Mobile-V2.sha256
          if-no-files-found: error
          retention-days: 30

      - name: تثبيت المشروع داخل المستودع بعد نجاح البناء
        if: steps.project.outputs.bootstrap == 'true'
        shell: bash
        run: |
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.gradle' \
            --exclude 'app/build' \
            .aion-bootstrap/ ./

          gradle wrapper --gradle-version 9.6.1 --distribution-type bin
          rm -rf .aion-bootstrap
          rm -f AION-Mobile-V2.zip

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "لا توجد تغييرات جديدة للحفظ."
          else
            git commit -m "تهيئة AION Mobile V2 بعد نجاح البناء"
            git push origin HEAD:main
          fi
