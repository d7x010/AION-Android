name: AION α7.3 Step 6 Gate

on:
  push:
    branches: [main]
    paths:
      - "AION-ALPHA73-STEP6-SOURCE.zip"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: Unit + Lint + APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: جلب المستودع
        uses: actions/checkout@v5

      - name: استخراج AION α7.3 dev14
        run: |
          set -euo pipefail
          test -f AION-ALPHA73-STEP6-SOURCE.zip
          rm -rf .aion-alpha73-step6
          mkdir .aion-alpha73-step6
          unzip -q AION-ALPHA73-STEP6-SOURCE.zip -d .aion-alpha73-step6
          test -f .aion-alpha73-step6/settings.gradle.kts
          test -f .aion-alpha73-step6/app/build.gradle.kts
          test -f .aion-alpha73-step6/app/src/main/java/com/aion/mobile/core/ai/ProviderRoutingPolicy.kt
          grep -q 'versionCode = 28' .aion-alpha73-step6/app/build.gradle.kts
          grep -q 'versionName = "2.0.0-alpha7.3-dev14"' .aion-alpha73-step6/app/build.gradle.kts
          grep -q 'function routingContractStatus' .aion-alpha73-step6/cloudflare/aion-core/src/index.js
          grep -q 'crossProviderFailover: false' .aion-alpha73-step6/cloudflare/aion-core/src/index.js

      - name: إعداد Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: إعداد Android SDK
        uses: android-actions/setup-android@v3

      - name: تثبيت Android 16 وأدوات البناء
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: إعداد Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"

      - name: Worker regression + Step 6 routing tests
        working-directory: .aion-alpha73-step6
        run: node cloudflare/aion-core/test-worker.mjs

      - name: Android Unit + Lint + assembleDebug
        working-directory: .aion-alpha73-step6
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace --no-daemon

      - name: التحقق من APK
        shell: bash
        run: |
          set -euo pipefail
          APK=.aion-alpha73-step6/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          cp "$APK" AION-alpha73-step6-dev14.apk
          sha256sum AION-alpha73-step6-dev14.apk | tee AION-alpha73-step6-dev14.sha256

      - name: رفع APK
        uses: actions/upload-artifact@v4
        with:
          name: AION-alpha73-step6-dev14-APK
          path: |
            AION-alpha73-step6-dev14.apk
            AION-alpha73-step6-dev14.sha256
          if-no-files-found: error
          retention-days: 30
