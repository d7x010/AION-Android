name: AION dev40 Replica Build
on:
  push:
    branches: [main]
    paths:
      - AION-ALPHA73-DEV40-REPLICA-COMPLETE-PASS-SOURCE.zip
      - .github/workflows/aion-alpha73-dev40-replica.yml
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: unzip -q AION-ALPHA73-DEV40-REPLICA-COMPLETE-PASS-SOURCE.zip -d .aion
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"
      - working-directory: .aion
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon
      - run: cp .aion/app/build/outputs/apk/debug/app-debug.apk AION-dev40.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AION-dev40-APK
          path: AION-dev40.apk
